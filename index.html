<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laxmi Chit Fund · Season 5</title>
<style>
:root{
  --pg:#0b0b0d; --s1:#17171a; --s2:#1f1f23; --s3:#2a2a30;
  --tp:#f5f5f7; --ts:#b9b9c2; --mut:#83838f; --line:#2c2c33; --hair:rgba(255,255,255,.07);
  --bl:#3987e5; --bl2:#6da7ec; --gold:#f0b429; --gold2:#c98500;
  --good:#22c55e; --bad:#ef6f6f; --violet:#9085e9;
  --c1:#3987e5; --c2:#e8863b; --c3:#1fb488; --c4:#e6c229; --c5:#d55181; --c6:#5bc46a;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --radius:16px;
}
[data-theme="light"]{
  --pg:#f4f4f2; --s1:#ffffff; --s2:#faf9f7; --s3:#efeeeb;
  --tp:#111114; --ts:#4a4a52; --mut:#83838f; --line:#e6e5e1; --hair:rgba(0,0,0,.07);
  --gold:#b8850b; --good:#0a9c3f; --bad:#d84a4a;
  --shadow:0 8px 30px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pg);color:var(--tp);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 460px at 80% -140px,rgba(240,180,41,.10),transparent 60%),
    radial-gradient(900px 420px at 4% -90px,rgba(57,135,229,.08),transparent 60%);
  background-attachment:fixed}
[data-theme="light"] body{background-image:radial-gradient(1100px 460px at 80% -160px,rgba(240,180,41,.14),transparent 60%),
    radial-gradient(900px 420px at 4% -90px,rgba(57,135,229,.10),transparent 60%)}
.tnum{font-variant-numeric:tabular-nums}
/* flair */
.sh{display:flex;align-items:center;gap:9px;margin:22px 0 12px;font-weight:800;font-size:15px}
.sh::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--gold),#d9820c)}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.rc{position:relative;background:linear-gradient(150deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:13px;padding:11px 14px;overflow:hidden}
.rc::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;opacity:.14;filter:blur(6px)}
.rc.w::after{background:var(--gold)}.rc.r::after{background:var(--good)}.rc.c::after{background:var(--bl)}.rc.k2::after{background:var(--violet)}
.rc.k2 .pill{color:var(--violet)}
.rc .lb{color:var(--ts);font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.rc .big{font-size:17px;font-weight:820;margin-top:5px;letter-spacing:-.3px}
.rc .rcm{color:var(--mut);font-size:11.5px;margin-top:1px}
.rctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc .pill{font-size:15px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.rstrip{display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:13px;padding:9px 15px;flex-wrap:wrap;margin-bottom:16px}
.ri{display:flex;align-items:center;gap:10px;min-width:0}
.ri .ic{font-size:16px;line-height:1}
.ri .rl{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:650}
.ri .rv{font-weight:750;font-size:13.5px;margin-top:1px}
.ri .rv .up{color:var(--good)}.ri .rv .dn{color:var(--bad)}.ri .rv .pt{color:var(--ts);font-weight:600}
.rsep{width:1px;align-self:stretch;background:var(--line);margin:3px 2px}
@media(max-width:640px){.rsep{display:none}.ri{flex:1 1 42%}}
.rc.w .pill{color:var(--gold)}.rc.r .pill{color:var(--good)}.rc.c .pill{color:var(--bl)}
.medal{width:27px;height:27px;border-radius:50%;display:inline-grid;place-items:center;font-weight:900;font-size:12.5px;color:#1a1400}
.m1{background:linear-gradient(135deg,#ffe27a,#f0b429);box-shadow:0 0 12px rgba(240,180,41,.5)}
.m2{background:linear-gradient(135deg,#eaeaf0,#b4b4bf);color:#2a2a30}
.m3{background:linear-gradient(135deg,#eaa96a,#c17e3f);color:#2a1500}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--good);background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
a{color:inherit}
/* header */
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--pg) 82%,transparent);border-bottom:1px solid var(--line)}
.hin{max-width:1120px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px}
.crest{width:40px;height:40px;border-radius:12px;
  background:radial-gradient(120% 120% at 30% 20%,#ffe27a,#f0b429 42%,#d9820c);
  display:grid;place-items:center;font-weight:900;color:#5a3a00;font-size:20px;
  box-shadow:0 5px 16px rgba(224,133,14,.42),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 4px rgba(150,80,0,.35);
  border:1px solid rgba(255,220,120,.5)}
.mark{width:38px;height:44px;flex:0 0 auto;display:grid;place-items:center;filter:drop-shadow(0 3px 8px rgba(240,180,41,.28))}
.brandtxt{line-height:1.2}
.brandtxt .t{font-weight:820;font-size:16.5px;letter-spacing:-.2px;color:var(--gold)}
.s5{font-size:10px;font-weight:900;color:#3a2600;background:linear-gradient(135deg,#ffe27a,var(--gold));
  padding:2px 7px;border-radius:7px;letter-spacing:.3px;box-shadow:0 1px 3px rgba(224,133,14,.4)}
.brandtxt .s{color:var(--mut);font-size:11.5px;margin-top:1px}
.hpills{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px;color:var(--ts);white-space:nowrap}
.pill b{color:var(--tp)}
.iconbtn{background:var(--s2);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--ts);font-size:15px;display:grid;place-items:center}
.iconbtn:hover{color:var(--tp)}
/* nav */
nav{position:sticky;top:60px;z-index:25;background:color-mix(in srgb,var(--pg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navin{max-width:1120px;margin:0 auto;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px}
.navin>button{background:var(--s2);border:1px solid var(--line);color:var(--ts);font:inherit;font-size:12px;
  font-weight:650;padding:6px 11px;cursor:pointer;white-space:nowrap;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;transition:all .14s}
.navin>button .ni{font-size:11.5px;line-height:1}
.navin>button:hover{background:var(--s3);color:var(--tp);border-color:var(--mut)}
.navin>button.on{background:linear-gradient(135deg,#ffe27a,var(--gold));color:#3a2600;
  border-color:transparent;box-shadow:0 3px 12px rgba(224,133,14,.35);font-weight:750}
main{max-width:1120px;margin:0 auto;padding:22px 16px 70px}
section{display:none;animation:fade .25s ease}section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* generic */
h2{font-size:15px;margin:26px 0 12px;font-weight:750;letter-spacing:.2px}
h2:first-child{margin-top:2px}
.sub{color:var(--mut);font-size:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.awardhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
.awardhd h1{font-size:22px;margin:0;font-weight:820;letter-spacing:.2px}
.prizetag{font-size:12px;font-weight:800;color:#1a1400;background:linear-gradient(135deg,var(--gold),#e0850e);padding:3px 10px;border-radius:20px}
.awarddesc{color:var(--ts);font-size:13px;margin:0 0 16px;max-width:70ch}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 14px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--gold),transparent)}
.tile .k{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.tile .v{font-size:20px;font-weight:820;margin-top:2px;letter-spacing:-.4px}
.tile .d{color:var(--ts);font-size:11.5px;margin-top:0}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--ts);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
  padding:12px 12px;font-weight:750;border-bottom:1px solid var(--line);position:sticky;
  background:var(--s2)}
.tbl th.r{text-align:right}.tbl th.c{text-align:center}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--hair)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--s2)}
.r{text-align:right}.c{text-align:center}
.rkcell{width:34px;color:var(--mut);font-weight:800;font-variant-numeric:tabular-nums}
.mono{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto}
.mcell{display:flex;align-items:center;gap:10px}
.mcell .nm{font-weight:650}
.teamcell{color:var(--ts)}
.big{font-weight:800;font-variant-numeric:tabular-nums}
.gw{color:var(--ts);font-variant-numeric:tabular-nums}
.mv-up{color:var(--good)}.mv-dn{color:var(--bad)}.mv-eq{color:var(--mut)}
tr.prizerow{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 12%,transparent),transparent)}
tr.prizerow .rkcell{color:var(--gold)}
tr.you-row{box-shadow:inset 3px 0 0 var(--bl)}
.pz{color:var(--gold);font-weight:800;font-size:12px;white-space:nowrap}
.chipdots{display:inline-flex;gap:3px}
.cd{width:7px;height:7px;border-radius:50%}
/* hero winner */
.winner{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--radius);
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 16%,var(--s1)),var(--s1));
  border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line))}
.winner .mono{width:46px;height:46px;font-size:17px;border-radius:12px}
.winner .lab{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}
.winner .who{font-size:19px;font-weight:820}
.winner .meta{color:var(--ts);font-size:12.5px;margin-top:1px}
.winner .score{margin-left:auto;text-align:right}
.winner .score .n{font-size:32px;font-weight:850;line-height:1}
.winner .score .u{color:var(--mut);font-size:11px}
/* chip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.chipc{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:17px;position:relative;overflow:hidden}
.chipc .ic{font-size:15px}
.chipc .hd{display:flex;align-items:center;gap:8px;color:var(--ts);font-weight:650;font-size:12.5px}
.chipc .n{font-size:36px;font-weight:850;margin:10px 0 2px;letter-spacing:-1px}
.chipc .n span{font-size:14px;color:var(--mut);font-weight:600;margin-left:3px}
.chipc .who{font-weight:650}.chipc .gw{color:var(--gold);font-size:11.5px;margin-top:7px}
/* MT */
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:none;color:var(--ts);font:inherit;font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--bl);color:#fff}
.mthd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.mttitle{font-size:18px;font-weight:820}
.st{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-left:8px;letter-spacing:.4px}
.st.complete{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.st.live{color:var(--bl);background:color-mix(in srgb,var(--bl) 15%,transparent)}
.st.upcoming{color:var(--mut);background:var(--s3)}
.mtmeta{color:var(--mut);font-size:12px}
.phase{font-size:13.5px;font-weight:820;margin:22px 0 3px;display:flex;align-items:center;gap:8px}
.phase .pl{color:var(--mut);font-weight:600;font-size:12px}
.phsub{color:var(--ts);font-size:12px;margin-bottom:11px}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.grp{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.grphd{font-weight:750;font-size:12.5px;margin-bottom:7px;color:var(--bl)}
.gt{width:100%;border-collapse:collapse}
.gt th{color:var(--mut);font-size:10px;text-transform:uppercase;text-align:center;padding:4px 3px;font-weight:700}
.gt th:first-child{text-align:left}
.gt td{text-align:center;padding:6px 3px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums}
.gt td.t{text-align:left;font-weight:600}
.gt tr.adv td{background:color-mix(in srgb,var(--good) 8%,transparent)}
.gt tr.adv td.t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.bcol{display:flex;flex-direction:column;gap:12px}
.bclab{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;margin-bottom:6px}
.tie{background:var(--s1);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.tside{display:flex;justify-content:space-between;padding:9px 12px;font-size:12.5px}
.tside:first-child{border-bottom:1px solid var(--hair)}
.tside b{font-variant-numeric:tabular-nums;color:var(--mut)}
.tside.w{background:color-mix(in srgb,var(--good) 12%,transparent)}
.tside.w span{font-weight:750}.tside.w b{color:var(--good)}
.chmp{margin-top:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--s1)),var(--s1));
  border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:2px}
.chmp span{color:var(--gold);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.chmp b{font-size:15px}
/* notes / locked */
.note{background:color-mix(in srgb,var(--bl) 9%,var(--s1));border:1px solid color-mix(in srgb,var(--bl) 28%,var(--line));
  border-radius:12px;padding:13px 15px;color:var(--ts);font-size:12.5px;margin:12px 0}
.locked{background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.foot{color:var(--mut);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.6}
/* hero preseason */
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--bl) 18%,var(--s1)),var(--s1));
  border:1px solid color-mix(in srgb,var(--bl) 30%,var(--line));border-radius:20px;padding:34px;text-align:center;margin-bottom:18px}
.hero .cd2{color:var(--bl);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.6px}
.hero .big2{font-size:clamp(26px,5vw,40px);font-weight:850;margin:8px 0;letter-spacing:-1px}
/* charts */
.chartwrap{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px 16px 8px}
.chartttl{font-weight:750;font-size:13px;margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 2px 0}
.legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ts)}
.legend .sw{width:11px;height:3px;border-radius:2px}
svg{display:block;width:100%;height:auto;overflow:visible}
/* profiles tab */
.search{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--line);border-radius:11px;
  padding:10px 14px;color:var(--tp);font:inherit;font-size:13px;margin-bottom:14px;outline:none}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--s1);border:1px solid var(--line);border-top:3px solid var(--gold);
  border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35);border-color:var(--mut);border-top-color:var(--gold)}
.pchd{padding:15px 17px 13px}
.pchd .pn{font-weight:780;font-size:16px;letter-spacing:-.2px}
.pchd .pt{color:var(--mut);font-size:12.5px;margin-top:1px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:10px 17px;
  border-top:1px dashed var(--line);font-size:12.5px}
.prow .k{color:var(--ts)}
.prow .v{font-weight:780;font-variant-numeric:tabular-nums}
.prow .v small{color:var(--mut);font-weight:600;margin-left:4px}
.pn2{font-weight:650}
/* head-to-head */
.h2sel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h2sel .search{max-width:none;flex:1 1 240px;margin:0}
.vs{color:var(--mut);font-weight:800;font-size:12px}
.h2wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.h2col{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.h2col .mono{width:44px;height:44px;font-size:16px;border-radius:12px;margin:0 auto 8px}
.h2nm{font-weight:780;font-size:15px}
.h2big{font-size:30px;font-weight:850;margin-top:12px}
.h2stats{display:flex;flex-direction:column;gap:3px;margin-top:12px;color:var(--ts);font-size:12px}
.h2mid{text-align:center;min-width:110px}
.h2rec{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums}.h2rec span{color:var(--mut);margin:0 3px;font-size:16px}
.h2gap{margin-top:10px;font-size:13px;font-weight:700;color:var(--gold)}
@media(max-width:640px){.h2wrap{grid-template-columns:1fr;gap:10px}.h2mid{order:3}}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:none;
  align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.overlay.on{display:flex}
.modal{background:var(--pg);border:1px solid var(--line);border-radius:20px;max-width:760px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mhd{display:flex;align-items:center;gap:14px;padding:20px 56px 20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--pg);border-radius:20px 20px 0 0;z-index:2}
.mhd .mono{width:50px;height:50px;font-size:18px;border-radius:13px}
.mhd .who{font-size:19px;font-weight:820}
.mhd .meta{color:var(--ts);font-size:12.5px}
.mhd .rankbadge{margin-left:auto;text-align:right}
.mhd .rankbadge .n{font-size:26px;font-weight:850;line-height:1}
.mhd .rankbadge .u{color:var(--mut);font-size:11px}
.mclose{position:absolute;top:16px;right:16px;background:var(--s2);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;cursor:pointer;color:var(--ts);font-size:16px}
.mbody{padding:20px 22px}
.ministat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:18px}
.ms{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.ms .k{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.ms .v{font-size:19px;font-weight:820;margin-top:3px}
.chiplist{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chipbadge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--s2);border:1px solid var(--line);color:var(--ts)}
@media(max-width:720px){.two{grid-template-columns:1fr}.bracket{grid-template-columns:1fr}
  .navin>button{padding:12px 10px}.hin{padding:11px 14px}.teamcell.hide{display:none}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand">
    <div class="mark"><svg width="34" height="40" viewBox="0 0 80 90" aria-label="Laxmi Chit Fund crest">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d212b"/><stop offset="1" stop-color="#101319"/></linearGradient></defs>
      <path d="M40 3 L74 15 V44 C74 66 58 80 40 87 C22 80 6 66 6 44 V15 Z" fill="url(#sg)" stroke="#f0b429" stroke-width="3.2"/>
      <path d="M40 10 L68 20 V44 C68 62 55 74 40 80 C25 74 12 62 12 44 V20 Z" fill="none" stroke="#f0b429" stroke-width="1" opacity=".35"/>
      <text x="40" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="25" fill="#f0b429">LCF</text></svg></div>
    <div class="brandtxt"><div class="t">Laxmi Chit Fund <span class="s5">S5</span></div>
    <div class="s">FPL 2026/27 · cash league</div></div></div>
  <div class="hpills" id="pills"></div>
  <button class="iconbtn" id="theme" title="Toggle theme">◑</button>
</div></header>
<nav><div class="navin" id="nav">
  <button class="on" data-t="overall"><span class="ni">🏆</span>Overall</button>
  <button data-t="mt"><span class="ni">⚔️</span>Tournaments</button>
  <button data-t="cup"><span class="ni">🥇</span>Cup</button>
  <button data-t="chips"><span class="ni">🃏</span>Chips</button>
  <button data-t="cap"><span class="ni">🧢</span>Captaincy</button>
  <button data-t="arrows"><span class="ni">📈</span>Green Arrows</button>
  <button data-t="diamond"><span class="ni">💎</span>Differentials</button>
  <button data-t="comeback"><span class="ni">🔥</span>Comeback</button>
  <button data-t="pity"><span class="ni">💀</span>Pity</button>
  <button data-t="prizes"><span class="ni">💰</span>Prizes</button>
  <button data-t="profiles"><span class="ni">👤</span>Profiles</button>
  <button data-t="h2h"><span class="ni">⚔️</span>H2H</button>
</div></nav>
<main id="main"><div class="locked" style="margin-top:40px">Loading dashboard…</div></main>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRIZE={1:"₹30,000",2:"₹20,000",3:"₹12,500",4:"₹7,500",5:"₹5,000"};
const MONOC=['#3987e5','#e8863b','#1fb488','#c98500','#d55181','#5bc46a','#9085e9','#ef6f6f','#2ba3a3','#b06fd6'];
let DATA=null,curMT=null,BYID={};

function mono(team,id){
  const clean=(team||'?').replace(/[^A-Za-z0-9 ]/g,'').trim();
  const words=clean.split(/\s+/).filter(Boolean);
  let init=words.length>1?words.map(w=>w[0]).join('').slice(0,2):(clean.slice(0,2));
  init=(init||'?').toUpperCase();
  const c=MONOC[(id||0)%MONOC.length];
  return `<span class="mono" style="background:linear-gradient(135deg,${c},${c}bb)">${esc(init)}</span>`;
}
function fmtDeadline(iso){if(!iso)return"";const d=new Date(iso);
  return d.toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'})+" IST";}
function move(rank,last){if(!last||!rank||last===0)return'<span class="mv-eq">–</span>';
  if(rank<last)return`<span class="mv-up">▲${last-rank}</span>`;if(rank>last)return`<span class="mv-dn">▼${rank-last}</span>`;return'<span class="mv-eq">–</span>';}
function medalCell(n){return (n>=1&&n<=3)?`<td class="rkcell"><span class="medal m${n}">${n}</span></td>`:`<td class="rkcell">${n||''}</td>`;}
function ordinal(n){if(!n)return'';const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

/* ---------- charts ---------- */
function fmtK(v){v=Math.round(v);const a=Math.abs(v);
  if(a>=1e6)return(v/1e6).toFixed(a>=1e7?0:1)+'M';
  if(a>=1e3)return(v/1e3).toFixed(a>=1e4?0:1)+'k';return v;}
function lineChart(datasets,{yLabel,invert=false,W=680,H=240,pad=[16,58,28,40],endLabels=true}={}){
  const xs=datasets.flatMap(d=>d.points.map(p=>p.x));
  const ys=datasets.flatMap(d=>d.points.map(p=>p.y));
  if(!xs.length)return'';
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const[pt,pr,pb,pl]=pad;
  const sx=x=>pl+(x1===x0?0:(x-x0)/(x1-x0))*(W-pl-pr);
  const sy=y=>{const t=(y1===y0?.5:(y-y0)/(y1-y0));return invert?pt+t*(H-pt-pb):pt+(1-t)*(H-pt-pb);};
  const grid=[0,.25,.5,.75,1].map(f=>{const yy=pt+f*(H-pt-pb);
    const val=Math.round((invert?y0+f*(y1-y0):y1-f*(y1-y0)));
    return`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
      <text x="${pl-8}" y="${yy+3}" text-anchor="end" font-size="10" fill="var(--mut)">${fmtK(val)}</text>`;}).join('');
  const xt=datasets[0].points.filter((_,i,a)=>i%Math.ceil(a.length/6)===0||i===a.length-1)
    .map(p=>`<text x="${sx(p.x)}" y="${H-pb+16}" text-anchor="middle" font-size="10" fill="var(--mut)">${p.x}</text>`).join('');
  const lines=datasets.map(d=>{
    const path=d.points.map((p,i)=>(i?'L':'M')+sx(p.x)+' '+sy(p.y)).join(' ');
    const last=d.points[d.points.length-1];
    return`<path d="${path}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${sx(last.x)}" cy="${sy(last.y)}" r="4" fill="${d.color}" stroke="var(--s1)" stroke-width="2"/>
      ${(endLabels&&d.label)?`<text x="${sx(last.x)+8}" y="${sy(last.y)+3}" font-size="10.5" font-weight="700" fill="var(--ts)">${esc(d.label)}</text>`:''}`;
  }).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${xt}${lines}
    <text transform="translate(13,${(pt+H-pb)/2}) rotate(-90)" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(yLabel||'')}</text></svg>`;
}
function colChart(points,{W=680,H=170,pad=[14,10,26,34],marks={}}={}){
  if(!points.length)return'';
  const[pt,pr,pb,pl]=pad;const y1=Math.max(...points.map(p=>p.y),1);
  const bw=Math.min(22,(W-pl-pr)/points.length*0.68);
  const step=(W-pl-pr)/points.length;
  const bars=points.map((p,i)=>{const x=pl+i*step+step/2-bw/2;const h=(p.y/y1)*(H-pt-pb);
    const chip=marks[p.x];
    return`<rect x="${x}" y="${H-pb-h}" width="${bw}" height="${h}" rx="3" fill="${chip?'var(--gold)':'var(--bl)'}"/>
      ${chip?`<circle cx="${x+bw/2}" cy="${H-pb-h-7}" r="3" fill="var(--gold)"/>`:''}
      ${(i%Math.ceil(points.length/8)===0||i===points.length-1)?`<text x="${x+bw/2}" y="${H-pb+15}" text-anchor="middle" font-size="9.5" fill="var(--mut)">${p.x}</text>`:''}`;
  }).join('');
  const gl=[0,.5,1].map(f=>`<line x1="${pl}" y1="${pt+f*(H-pt-pb)}" x2="${W-pr}" y2="${pt+f*(H-pt-pb)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${pl-6}" y="${pt+f*(H-pt-pb)+3}" text-anchor="end" font-size="9.5" fill="var(--mut)">${Math.round(y1-f*y1)}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}">${gl}${bars}</svg>`;
}

/* ---------- render ---------- */
function render(){
  const m=DATA.meta;
  BYID={};DATA.standings.forEach(s=>BYID[s.id]=s);
  $('#pills').innerHTML=`${m.live?`<span class="live"><span class="livedot"></span>Live · GW${m.live}</span>`:''}${m.started?`<span class="pill">GW <b>${m.gw}</b></span>`:'<span class="pill"><b>Pre-season</b></span>'}
    <span class="pill">Pot <b>${esc(m.pool)}</b></span><span class="pill"><b>${m.managers}</b> mgrs</span>`;
  const views={overall:vOverall(),mt:vMT(),cup:vCup(),chips:vChips(),
    cap:vBoard('cap'),arrows:vBoard('arrows'),diamond:vDiamond(),comeback:vBoard('comeback'),
    pity:vPity(),prizes:vPrizes(),profiles:vProfiles(),h2h:vH2H()};
  const order=['overall','mt','cup','chips','cap','arrows','diamond','comeback','pity','prizes','profiles','h2h'];
  const cur=$('.navin button.on')?.dataset.t||'overall';
  $('#main').innerHTML=order.map(id=>`<section id="${id}" class="${id===cur?'on':''}">${views[id]}</section>`).join('');
  wireMT();wireRows();wireProfiles();wireH2H();
  $('#main').insertAdjacentHTML('beforeend',freshLine());
}

function vOverall(){
  const m=DATA.meta,S=DATA.standings;
  if(!m.started){
    const prerows=S.map((r,i)=>`<tr data-id="${r.id}" class="${r.id===m.my_id?'you-row':''}">
      <td class="rkcell">${i+1}</td><td class="c"><span class="mv-eq">–</span></td>
      <td><div class="mcell">${mono(r.team,r.id)}<div class="nm">${esc(r.name)}</div></div></td>
      <td class="teamcell hide">${esc(r.team)}</td>
      <td class="r gw">0</td><td class="r big">0</td></tr>`).join('');
    return `<div class="hero"><div class="cd2">First deadline</div>
      <div class="big2">${fmtDeadline(m.next_deadline)}</div>
      <div class="sub">The table goes live the moment GW1 is scored. Everyone starts on 0 · ${m.managers} of ${m.expected} managers joined.</div></div>
      <div class="card"><table class="tbl"><thead><tr>
        <th class="rkcell">#</th><th class="c"></th><th>Manager</th><th class="hide">Team</th>
        <th class="r">GW1</th><th class="r">Total</th></tr></thead>
        <tbody>${prerows}</tbody></table></div>
      <div class="foot">Tap any manager for their profile · ranks, scores and ▲▼ movement fill in from GW1</div>`;
  }
  const max=Math.max(...S.map(r=>r.total||0))||1;
  const rows=S.map(r=>{
    const chips=(r.chips_used||[]).length?`<span class="chipdots">${r.chips_used.map(()=>'<span class="cd" style="background:var(--violet)"></span>').join('')}</span>`:'';
    return`<tr data-id="${r.id}" class="${r.rank<=5?'prizerow':''} ${r.id===m.my_id?'you-row':''}">
      ${medalCell(r.rank)}<td class="c">${move(r.rank,r.last_rank)}</td>
      <td><div class="mcell">${mono(r.team,r.id)}<div class="nm">${esc(r.name)} ${chips}</div></div></td>
      <td class="teamcell hide">${esc(r.team)}</td>
      <td class="r gw">${r.event_total??''}</td><td class="r big">${r.total??''}</td></tr>`;
  }).join('');
  const gap=(S[0]?.total||0)-(S[1]?.total||0);
  const topN=S.slice(0,6);
  const ds=topN.map((r,i)=>({label:r.team,color:MONOC[i%6],
    points:(r.series||[]).map(p=>({x:p.gw,y:p.total}))})).filter(d=>d.points.length);
  const legend=ds.map(d=>`<span class="li"><span class="sw" style="background:${d.color}"></span>${esc(d.label)}</span>`).join('');
  const chart=ds.length?`<div class="chartwrap" style="margin-bottom:18px">
      <div class="chartttl">Points progression — top ${topN.length}</div>
      <div class="sub">Cumulative total by gameweek</div>${lineChart(ds,{yLabel:'Total pts',pad:[16,20,28,40],endLabels:false})}
      <div class="legend">${legend}</div></div>`:'';
  const byEvt=[...S].sort((a,b)=>(b.event_total||0)-(a.event_total||0));
  const gww=byEvt[0];
  const movers=S.filter(r=>r.last_rank&&r.rank);
  const riser=[...movers].sort((a,b)=>(b.last_rank-b.rank)-(a.last_rank-a.rank))[0];
  const faller=[...movers].sort((a,b)=>(b.rank-b.last_rank)-(a.rank-a.last_rank))[0];
  const rup=riser?riser.last_rank-riser.rank:0, rdn=faller?faller.rank-faller.last_rank:0;
  const recap=`<div class="sh">This Gameweek</div><div class="recap" style="margin-bottom:16px">
    <div class="rc w"><div class="rctop"><div class="lb"><span>🏅</span>GW${m.gw} Winner</div><div class="pill">${gww?.event_total??'–'}</div></div><div class="big">${esc(gww?.team||'–')}</div><div class="rcm">${esc(gww?.name||'')}</div></div>
    <div class="rc r"><div class="rctop"><div class="lb"><span>🚀</span>Biggest Riser</div><div class="pill">${rup>0?'▲'+rup:'–'}</div></div><div class="big">${esc(riser?.team||'–')}</div><div class="rcm">${rup>0?'now '+ordinal(riser.rank):'no movement yet'}</div></div>
    <div class="rc c"><div class="rctop"><div class="lb"><span>📉</span>Biggest Faller</div><div class="pill">${rdn>0?'▼'+rdn:'–'}</div></div><div class="big">${esc(faller?.team||'–')}</div><div class="rcm">${rdn>0?'now '+ordinal(faller.rank):'no movement yet'}</div></div>
    ${m.captain_week?`<div class="rc k2"><div class="rctop"><div class="lb"><span>🧢</span>Captain of the Week</div><div class="pill">${m.captain_week.pts}</div></div><div class="big">${esc(m.captain_week.player)}</div><div class="rcm">picked by ${m.captain_week.count} of ${m.captain_week.total}</div></div>`:''}
  </div>`;
  return`${recap}<div class="sh">Standings</div><div class="tiles" style="margin-bottom:16px">
      <div class="tile"><div class="k">Leader</div><div class="v">${esc(S[0]?.team||'–')}</div><div class="d">${S[0]?.total??''} pts · ${esc(S[0]?.name||'')}</div></div>
      <div class="tile"><div class="k">Lead margin</div><div class="v">${gap}</div><div class="d">1st over 2nd</div></div>
      <div class="tile"><div class="k">Top GW${m.gw}</div><div class="v">${Math.max(...S.map(r=>r.event_total||0))}</div><div class="d">best this week</div></div>
      <div class="tile"><div class="k">Prize pool</div><div class="v">${esc(m.pool)}</div><div class="d">21 payouts</div></div>
    </div>
    <div class="card"><table class="tbl"><thead><tr>
      <th class="rkcell">#</th><th class="c"></th><th>Manager</th><th class="hide">Team</th>
      <th class="r">GW${m.gw}</th><th class="r">Total</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="foot" style="margin-top:12px">Tap any manager for their season profile · top 5 (gold) hold the overall-prize places · ● chips played</div>
    ${chart?`<div class="sh">Season trend</div>${chart}`:''}`;
}

/* mini-tournaments */
function grpTable(g){
  const rows=g.rows.map((r,i)=>`<tr class="${i<2?'adv':''}"><td class="t">${esc(r.team)}</td>
    <td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="r"><b>${r.pts}</b></td></tr>`).join('');
  return`<div class="grp"><div class="grphd">Group ${g.group}</div>
    <table class="gt"><thead><tr><th>Team</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function tie(t,ch){const aw=t.win&&t.win===t.a?'w':'',bw=t.win&&t.win===t.b?'w':'';
  return`<div class="tie ${ch?'':''}"><div class="tside ${aw}"><span>${esc(t.a)}</span><b>${t.sa??'–'}</b></div>
    <div class="tside ${bw}"><span>${esc(t.b)}</span><b>${t.sb??'–'}</b></div></div>`;}
function vMT(){
  const L=DATA.mini_tournaments;
  if(curMT===null)curMT=(L.find(x=>x.status==='live')||L.find(x=>x.status==='complete')||L[0]).id;
  const seg=L.map(x=>`<button class="${x.id===curMT?'on':''}" data-mt="${x.id}">MT${x.id}</button>`).join('');
  return`<div class="awardhd"><h1>Mini-Tournaments</h1><span class="prizetag">₹3,000 each</span></div>
    <p class="awarddesc">Top 24 of the overall table qualify for each tournament (re-checked every time), drawn into 6 balanced groups by a reproducible seeded pot draw. Group stage then knockouts.</p>
    <div class="seg" id="mtseg">${seg}</div><div id="mtbody">${mtBody(L.find(x=>x.id===curMT))}</div>`;
}
function mtBody(mt){
  const head=`<div class="mthd"><div><span class="mttitle">Mini-Tournament ${mt.id}</span><span class="st ${mt.status}">${mt.status}</span></div>
    <div class="mtmeta">${esc(mt.window)}${mt.seed?' · seed '+mt.seed:''}</div></div>`;
  if(mt.status==='upcoming'||!mt.groups)
    return head+`<div class="locked">🔒 The top-24 draw for MT${mt.id} runs after GW${mt.group_gws[0]-1}. Balanced pot draw, then group + knockouts appear here.</div>`;
  const gs=`<div class="phase">① Group Stage <span class="pl">GW${mt.group_gws[0]}–${mt.group_gws[2]}</span></div>
    <div class="phsub">${mt.status==='complete'?'Final group tables.':'Live — top 2 (●) per group advance.'}</div>
    <div class="grps">${mt.groups.map(grpTable).join('')}</div>`;
  let ko;
  if(mt.ko){
    const qf=mt.ko.qf.map(t=>tie(t)).join('');
    const sf=(mt.ko.sf||[]).map(t=>tie(t)).join('')||'<div class="locked">Awaiting quarterfinals</div>';
    const fn=mt.ko.final?tie(mt.ko.final,1):'<div class="locked">Awaiting semifinals</div>';
    const ch=mt.ko.champion?`<div class="chmp"><span>🏆 Champion · ₹3,000</span><b>${esc(mt.ko.champion)}</b></div>`:'';
    ko=`<div class="phase">② Knockouts <span class="pl">GW${mt.ko_gws[0]}–${mt.ko_gws[2]}</span></div>
      <div class="bracket"><div class="bcol"><div class="bclab">Quarterfinals</div>${qf}</div>
      <div class="bcol"><div class="bclab">Semifinals</div>${sf}</div>
      <div class="bcol"><div class="bclab">Final</div>${fn}${ch}</div></div>`;
  }else ko=`<div class="phase">② Knockouts <span class="pl">GW${mt.ko_gws[0]}–${mt.ko_gws[2]}</span></div>
    <div class="locked">🔒 The 8-team bracket (6 winners + 2 best runners-up) seeds automatically once the group stage ends at GW${mt.group_gws[2]}.</div>`;
  return head+gs+ko;
}
function wireMT(){const s=$('#mtseg');if(!s)return;s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  curMT=+b.dataset.mt;s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $('#mtbody').innerHTML=mtBody(DATA.mini_tournaments.find(x=>x.id===curMT));});}

function vCup(){return`<div class="awardhd"><h1>FPL League Cup</h1><span class="prizetag">₹4,000</span></div>
  <p class="awarddesc">The official FPL knockout cup — pulled straight from the game's API. Single-elimination, final on GW38. FPL's own rules (including byes) decide every tie.</p>
  <div class="locked">🔒 Cup fixtures appear here once FPL seeds the bracket (around GW17). Fully automatic — nothing to draw or maintain.</div>`;}

function vChips(){
  const c=DATA.side.chips;const ic={"Triple Captain":"©³","Bench Boost":"⛑","Wildcard":"🃏","Free Hit":"⚡"};
  const body=c?Object.entries(c).map(([k,v])=>v?`<div class="chipc"><div class="hd"><span class="ic">${ic[k]}</span>${k}</div>
      <div class="n">${v.score}<span>pts</span></div><div class="who">${esc(v.team)}</div><div class="sub">${esc(v.name)}</div>
      <div class="gw">best haul · GW${v.gw} · ₹3,000</div></div>`
    :`<div class="chipc"><div class="hd"><span class="ic">${ic[k]}</span>${k}</div><div class="n">–</div><div class="sub">not played yet</div><div class="gw">₹3,000</div></div>`).join('')
    :'<div class="locked">Chip returns appear once the season is underway.</div>';
  return`<div class="awardhd"><h1>Chip Kings</h1><span class="prizetag">₹3,000 × 4</span></div>
    <p class="awarddesc">The highest single-gameweek return with each chip, across either half of the season. Triple Captain counts only the tripled captain; the rest count the whole net team score.</p>
    <div class="cards">${body}</div>`;
}

function boardCfg(k){return{
  cap:{key:"captaincy",title:"Captaincy King",prize:"₹3,000",val:"pts",unit:"pts",
    desc:"Most total captain points after multipliers, across the season. The top 5 overall are excluded."},
  arrows:{key:"arrows",title:"Green Arrow King",prize:"₹3,000",val:"n",unit:"green arrows",
    desc:"Most gameweeks where your overall FPL rank improved on the week before. The top 5 overall are excluded."},
  comeback:{key:"comeback",title:"The Comeback",prize:"₹4,000",val:"pts",unit:"pts",
    desc:"Most points from GW20–38 among the 21 managers sitting in the bottom of the table after GW19."}
}[k];}
function vBoard(k){
  const cfg=boardCfg(k),arr=DATA.side[cfg.key];
  const head=`<div class="awardhd"><h1>${cfg.title}</h1><span class="prizetag">${cfg.prize}</span></div><p class="awarddesc">${cfg.desc}</p>`;
  if(!arr||!arr.length){
    const msg=k==='comeback'?'🔒 Unlocks after GW19 — the bottom 21 at the halfway mark then race from GW20.':'Race begins once GW1 is scored.';
    return head+`<div class="locked">${msg}</div>`;
  }
  const lead=arr[0];
  const winner=`<div class="winner" style="margin-bottom:16px">${mono(lead.team,lead.id)}
    <div><div class="lab">Current leader</div><div class="who">${esc(lead.team)}</div><div class="meta">${esc(lead.name)}</div></div>
    <div class="score"><div class="n">${lead[cfg.val]}</div><div class="u">${cfg.unit}</div></div></div>`;
  const rows=arr.map((o,i)=>`<tr data-id="${o.id}">${medalCell(i+1)}
    <td><div class="mcell">${mono(o.team,o.id)}<div><div class="nm">${esc(o.team)}</div><div class="sub">${esc(o.name)}</div></div></div></td>
    <td class="r big">${o[cfg.val]} <span class="sub">${cfg.unit}</span></td></tr>`).join('');
  return head+winner+`<div class="card"><table class="tbl"><tbody>${rows}</tbody></table></div>`;
}

function vDiamond(){
  const d=DATA.side.diamond;
  const head=`<div class="awardhd"><h1>Differential Diamond</h1><span class="prizetag">₹3,000</span></div>
    <p class="awarddesc">The biggest single-gameweek haul from a genuine differential — a starter owned by under 7.5% of all FPL managers. Ownership is snapshotted near each deadline; the winner is admin-confirmed.</p>`;
  if(!d)return head+`<div class="locked">No qualifying differential yet.</div>`;
  return head+`<div class="winner">${mono(d.team,0)}
    <div><div class="lab">Leading pick</div><div class="who">${esc(d.player)}</div>
    <div class="meta">${esc(d.team)} · ${esc(d.name)} · owned ${d.owned}% · GW${d.gw}</div></div>
    <div class="score"><div class="n">${d.haul}</div><div class="u">points</div></div></div>`;
}
function vPity(){
  const p=DATA.side.pity;
  const head=`<div class="awardhd"><h1>Pity the Living Dead</h1><span class="prizetag">₹2,000</span></div>
    <p class="awarddesc">The lowest valid gameweek score of the season (up to GW30). A score only counts with a full valid XI, no worse than a −8 hit, from an active manager — final say with the admins.</p>`;
  if(!p)return head+`<div class="locked">No scores yet.</div>`;
  const flag=(p.blanks!=null&&p.blanks>0)?` · ⚠ ${p.blanks}/${p.starters} starters didn't play`:'';
  return head+`<div class="winner">${mono(p.team,0)}
    <div><div class="lab">Lowest valid score</div><div class="who">${esc(p.team)}</div>
    <div class="meta">${esc(p.name)} · GW${p.gw} · hit taken ${p.hit}${flag} · pending admin validity check</div></div>
    <div class="score"><div class="n">${p.score}</div><div class="u">points</div></div></div>`;
}

function vProfiles(){
  const S=DATA.standings;
  const rk=n=>n?Number(n).toLocaleString('en-US'):'–';
  const cards=S.map(r=>{
    const c=r.career||{}, past=c.past||[], last=past.length?past[past.length-1]:null;
    return `<div class="pcard" data-pid="${r.id}">
      <div class="pchd"><div class="pn">${esc(r.name)}</div><div class="pt">${esc(r.team)}</div></div>
      <div class="prow"><span class="k">This season (league)</span><span class="v">${r.rank?'#'+r.rank:'–'}</span></div>
      <div class="prow"><span class="k">Seasons played</span><span class="v">${c.seasons??'–'}</span></div>
      <div class="prow"><span class="k">Best overall rank</span><span class="v">${rk(c.best_finish)}${c.best_season?` <small>(${esc(c.best_season)})</small>`:''}</span></div>
      <div class="prow"><span class="k">Last season rank</span><span class="v">${last?rk(last.rank):'–'}</span></div>
    </div>`;}).join('');
  return `<div class="awardhd"><h1>Manager Profiles</h1></div>
    <p class="awarddesc">Career snapshot pulled from each manager's FPL history — seasons played, best overall rank, and last season's finish. Tap a card for the full season detail.</p>
    <input class="search" id="psearch" placeholder="Search manager or team…" autocomplete="off">
    <div class="pgrid" id="pgrid">${cards}</div>`;
}
function wireProfiles(){
  const grid=$('#pgrid');if(!grid)return;
  grid.addEventListener('click',e=>{const c=e.target.closest('.pcard');if(c)openProfile(+c.dataset.pid,true);});
  const s=$('#psearch');
  if(s)s.addEventListener('input',()=>{const q=s.value.toLowerCase();
    grid.querySelectorAll('.pcard').forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(q)?'':'none';});});
}

/* ---------- prizes ---------- */
function vPrizes(){
  const S=DATA.standings, side=DATA.side||{}, mts=DATA.mini_tournaments||[];
  const tbd='<span class="sub">TBD</span>';
  const row=(cat,prize,leader)=>`<tr><td class="pn2">${cat}</td><td class="r pz">${prize}</td><td class="r">${leader}</td></tr>`;
  let rows='';
  [1,2,3,4,5].forEach(r=>{const m=S.find(x=>x.rank===r);rows+=row(`Overall — ${ordinal(r)}`,PRIZE[r],m?esc(m.team):tbd);});
  mts.forEach(mt=>{const c=(mt.ko&&mt.ko.champion)?esc(mt.ko.champion):(mt.status==='live'?'<span class="sub">in progress</span>':'<span class="sub">not started</span>');rows+=row(`Mini-Tournament ${mt.id}`,'₹3,000',c);});
  rows+=row('League Cup','₹4,000','<span class="sub">from ~GW17</span>');
  rows+=row('The Comeback','₹4,000',(side.comeback&&side.comeback[0])?esc(side.comeback[0].team):'<span class="sub">from GW20</span>');
  ["Triple Captain","Bench Boost","Wildcard","Free Hit"].forEach(k=>{const v=(side.chips||{})[k];rows+=row(`Chip King — ${k}`,'₹3,000',v?esc(v.team):'<span class="sub">not played</span>');});
  rows+=row('Captaincy King','₹3,000',(side.captaincy&&side.captaincy[0])?esc(side.captaincy[0].team):tbd);
  rows+=row('Green Arrow King','₹3,000',(side.arrows&&side.arrows[0])?esc(side.arrows[0].team):tbd);
  rows+=row('Differential Diamond','₹3,000',side.diamond?esc(side.diamond.team):tbd);
  rows+=row('Pity the Living Dead','₹2,000',side.pity?esc(side.pity.team):tbd);
  return `<div class="awardhd"><h1>Prize Board</h1><span class="prizetag">₹1,24,000</span></div>
    <p class="awarddesc">Every one of the 21 payouts and who's currently in line for it. Leaders update as the season runs; final settlement is after GW38.</p>
    <div class="card"><table class="tbl"><thead><tr><th>Category</th><th class="r">Prize</th><th class="r">Current leader</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- head-to-head ---------- */
function vH2H(){
  const S=DATA.standings;
  const opts=S.map(r=>`<option value="${r.id}">${esc(r.team)} — ${esc(r.name)}</option>`).join('');
  return `<div class="awardhd"><h1>Head-to-Head</h1></div>
    <p class="awarddesc">Compare any two managers gameweek by gameweek — who won more weeks, and the season gap.</p>
    <div class="h2sel"><select id="h2a" class="search">${opts}</select><span class="vs">vs</span><select id="h2b" class="search">${opts}</select></div>
    <div id="h2out"></div>`;
}
function wireH2H(){
  const a=$('#h2a'),b=$('#h2b');if(!a||!b)return;
  if(DATA.standings[1])b.value=DATA.standings[1].id;
  const upd=()=>{$('#h2out').innerHTML=h2render(+a.value,+b.value);};
  a.onchange=upd;b.onchange=upd;upd();
}
function h2render(ida,idb){
  const A=BYID[ida],B=BYID[idb];
  if(!A||!B)return'';
  if(ida===idb)return'<div class="locked">Pick two different managers to compare.</div>';
  const sa=A.series||[],sb=B.series||[];
  const gwset=sa.map(x=>x.gw).filter(g=>sb.some(y=>y.gw===g));
  let wa=0,wb=0,dr=0;
  gwset.forEach(g=>{const na=sa.find(x=>x.gw===g).net,nb=sb.find(y=>y.gw===g).net;if(na>nb)wa++;else if(nb>na)wb++;else dr++;});
  const bestA=sa.length?Math.max(...sa.map(x=>x.net)):'–',bestB=sb.length?Math.max(...sb.map(x=>x.net)):'–';
  const col=(m,wins,best,side)=>`<div class="h2col ${side}">${mono(m.team,m.id)}
    <div class="h2nm">${esc(m.team)}</div><div class="sub">${esc(m.name)}</div>
    <div class="h2big">${m.total??'–'}</div><div class="sub">total pts</div>
    <div class="h2stats"><span>#${m.rank??'–'} rank</span><span>${best} best GW</span><span>${wins} GW wins</span></div></div>`;
  const gap=Math.abs((A.total||0)-(B.total||0));
  return `<div class="h2wrap">${col(A,wa,bestA,'a')}
    <div class="h2mid"><div class="h2rec">${wa}<span>–</span>${dr}<span>–</span>${wb}</div><div class="sub">W–D–L (by GW)</div>
      <div class="h2gap">${gap} pt gap</div></div>
    ${col(B,wb,bestB,'b')}</div>
    <div class="foot" style="margin-top:14px">${gwset.length} gameweeks compared · net-of-hits scores</div>`;
}

function freshLine(){
  const m=DATA.meta;let rel='';
  if(m.updated_iso){const diff=(Date.now()-new Date(m.updated_iso).getTime())/60000;
    rel=diff<1?'just now':diff<60?Math.round(diff)+'m ago':Math.round(diff/60)+'h ago';}
  else if(m.updated)rel=m.updated;
  const stale=m.started&&m.updated_iso&&(Date.now()-new Date(m.updated_iso).getTime())>3*3600*1000;
  return `<div class="foot" style="margin-top:22px">${m.started?'Live data':'Pre-season'}${rel?' · updated '+rel:''} · auto-refreshes every few minutes${stale?' · <span style="color:var(--bad);font-weight:700">⚠ data looks stale</span>':''}</div>`;
}

/* ---------- profile modal ---------- */
function wireRows(){
  document.querySelectorAll('.tbl tbody tr[data-id]').forEach(tr=>
    tr.addEventListener('click',()=>openProfile(+tr.dataset.id)));
}
function openProfile(id,full){
  const m=BYID[id];if(!m)return;const s=m.series||[];
  const nets=s.map(p=>p.net);
  const best=nets.length?Math.max(...nets):null, worst=nets.length?Math.min(...nets):null;
  const avg=nets.length?Math.round(nets.reduce((a,b)=>a+b,0)/nets.length):null;
  const captot=s.reduce((a,p)=>a+(p.cap_pts||0),0);
  let arrows=0,prev=null;s.forEach(p=>{if(p.orank!=null){if(prev!=null&&p.orank<prev)arrows++;prev=p.orank;}});
  const rankChart=s.filter(p=>p.orank!=null).length?
    lineChart([{color:'var(--bl)',points:s.filter(p=>p.orank!=null).map(p=>({x:p.gw,y:p.orank}))}],
      {yLabel:'Overall rank',invert:true,H:180}):'<div class="sub">Rank chart appears after GW1.</div>';
  const marks={};s.forEach(p=>{if(p.chip)marks[p.gw]=p.chip;});
  const ptsChart=s.length?colChart(s.map(p=>({x:p.gw,y:p.net})),{marks}):'';
  const chipNames={"3xc":"Triple Captain","bboost":"Bench Boost","wildcard":"Wildcard","freehit":"Free Hit"};
  const chips=(m.chips_used||[]).map(c=>`<span class="chipbadge">${chipNames[c]||c}</span>`).join('')||'<span class="sub">none yet</span>';
  const st=(k,v)=>`<div class="ms"><div class="k">${k}</div><div class="v">${v??'–'}</div></div>`;
  const car=m.career||{};
  const rk=n=>n?('#'+Number(n).toLocaleString('en-US')):'–';
  const bestFin=car.best_finish?`${rk(car.best_finish)}`:'–';
  const past=(car.past||[]).slice().reverse();
  const pastTbl=past.length?`<div class="chartttl" style="margin:16px 0 4px">Past seasons</div>
    <div class="card"><table class="tbl"><thead><tr><th>Season</th><th class="r">Points</th><th class="r">Overall rank</th></tr></thead>
    <tbody>${past.map(p=>`<tr style="cursor:default"><td>${esc(p.s)}</td><td class="r gw">${p.pts?.toLocaleString?.('en-US')??'–'}</td><td class="r">${rk(p.rank)}</td></tr>`).join('')}</tbody></table></div>`:'';
  $('#modal').innerHTML=`<div class="mhd">${mono(m.team,m.id)}
    <div><div class="who">${esc(m.team)}</div><div class="meta">${esc(m.name)}${m.id===DATA.meta.my_id?' · you':''}${car.region?' · '+esc(car.region):''}</div></div>
    <div class="rankbadge"><div class="n">${m.rank?'#'+m.rank:'–'}</div><div class="u">${move(m.rank,m.last_rank)} in league</div></div>
    <button class="mclose" id="mclose">✕</button></div>
    <div class="mbody">
      <div class="ministat">${st('Total',m.total)}${st('Best GW',best)}${st('Worst GW',worst)}${st('Avg',avg)}${st('Captain pts',captot||0)}${st('Green arrows',arrows)}${full?st('FPL seasons',car.seasons)+st('Best-ever finish',bestFin)+st('Overall rank',rk(car.overall_rank)):''}</div>
      <div class="chartwrap" style="margin-bottom:14px"><div class="chartttl">Overall rank over time</div><div class="sub">Higher is better</div>${rankChart}</div>
      ${ptsChart?`<div class="chartwrap" style="margin-bottom:14px"><div class="chartttl">Gameweek points</div><div class="sub">Gold = a chip was played that week</div>${ptsChart}</div>`:''}
      <div class="chartttl" style="margin-bottom:4px">Chips used</div><div class="chiplist">${chips}</div>
      ${full?pastTbl:''}
    </div>`;
  $('#overlay').classList.add('on');document.body.style.overflow='hidden';
  $('#mclose').onclick=closeProfile;
}
function closeProfile(){$('#overlay').classList.remove('on');document.body.style.overflow='';}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeProfile();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile();});

/* nav + theme */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#nav>button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');const el=document.getElementById(b.dataset.t);if(el)el.classList.add('on');
  window.scrollTo({top:0,behavior:'instant'});});
$('#theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');});

function load(initial){
  return fetch('data.json?_='+Date.now()).then(r=>r.json()).then(d=>{
    const changed=!DATA||DATA.meta.updated_iso!==d.meta.updated_iso;
    DATA=d;
    if(initial||changed)render();
  }).catch(()=>{if(initial)$('#main').innerHTML='<div class="locked" style="margin-top:40px">Could not load data.json yet. If you just set this up, the first update run will create it shortly.</div>';});
}
load(true);
setInterval(()=>load(false),180000);               // re-pull every 3 minutes
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false);});
</script>
</body>
</html>
