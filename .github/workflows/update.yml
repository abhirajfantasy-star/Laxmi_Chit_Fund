name: Update dashboard data

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the data engine
        run: |
          export UPDATED_AT="$(date -u '+%d %b %Y, %H:%M UTC')"
          python engine.py

      - name: Commit updated data
        run: |
          git config user.name  "laxmi-bot"
          git config user.email "actions@github.com"
          git add data.json draws/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update dashboard data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
